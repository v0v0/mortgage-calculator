name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check rate-verification-loader.js
          node --check stability-prelude.js
          node --check enhancements.js
          node --check ui-layout-sync.js
          node --check calculation-fixes.js
          node --check detail-loading.js
          node --check share-state.js
          node --check share-ui-patch.js
          node --check analytics.js
          node --check analytics-worker/src/index.js
      - name: Validate rate and analytics data
        run: |
          python -m json.tool data/mortgage-rates.json > /dev/null
          python -m json.tool data/rate-verification-2026-09-03.json > /dev/null
          python -m json.tool data/analytics-config.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          verified = json.loads(Path('data/rate-verification-2026-09-03.json').read_text(encoding='utf-8'))
          tiers = verified['cityScope']['tiers']
          scoped_ids = [city_id for city_ids in tiers.values() for city_id in city_ids]
          verified_ids = set(verified['rates'])

          assert list(tiers) == ['一线', '新一线', '二线'], list(tiers)
          assert [len(tiers['一线']), len(tiers['新一线']), len(tiers['二线'])] == [4, 15, 30]
          assert len(scoped_ids) == 49, f'expected 49 scoped cities, got {len(scoped_ids)}'
          assert len(set(scoped_ids)) == 49, 'duplicate city id in cityScope'
          assert set(scoped_ids) == verified_ids, f'scope/rates mismatch: missing={set(scoped_ids)-verified_ids}, extra={verified_ids-set(scoped_ids)}'

          for city_id, row in verified['rates'].items():
              rate, bp, quality, confidence, source_id = row
              assert 2.0 <= rate <= 5.0, (city_id, rate)
              assert abs((verified['lpr'][1] + bp / 100) - rate) < 1e-9, (city_id, rate, bp)
              assert quality in {'VC','VR','OF','NO','CM','NF','MR'}, (city_id, quality)
              assert confidence in {'H','M','L'}, (city_id, confidence)
              assert source_id in verified['sources'], (city_id, source_id)
          PY
      - name: Verify required files
        run: |
          test -f index.html
          test -f styles.css
          test -f enhancements.css
          test -f ux-v3.css
          test -f stability-prelude.js
          test -f enhancements.js
          test -f ui-layout-sync.js
          test -f calculation-fixes.js
          test -f detail-loading.js
          test -f share-state.js
          test -f share-ui-patch.js
          test -f analytics.js
          test -f ANALYTICS.md
          test -f analytics-worker/src/index.js
          test -f analytics-worker/schema.sql
          test -f PRODUCT_REQUIREMENTS.md
          test -f RATE_VERIFICATION.md
          test -f rate-verification-loader.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
